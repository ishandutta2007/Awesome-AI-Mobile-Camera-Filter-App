<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); }
      50%, 100% { transform: translateX(200%); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes reticleSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(160px); opacity: 0; }
    }
    .orb-animated-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 150px;
    }
    .orb-animated-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 250px;
    }
    .float-1 { animation: floatPill 5s ease-in-out infinite; }
    .float-2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .float-3 { animation: floatPill 5.5s ease-in-out 2s infinite; }
    .float-4 { animation: floatPill 6.5s ease-in-out 0.5s infinite; }
    .reticle-spin {
      animation: reticleSpin 25s linear infinite;
      transform-origin: 1020px 180px;
    }
    .scanner {
      animation: scanLine 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb-animated-1" cx="200" cy="140" r="180" fill="url(#orbGrad1)" />
  <circle class="orb-animated-2" cx="1020" cy="240" r="210" fill="url(#orbGrad2)" />

  <!-- Camera Viewfinder / AI Filter Focus Reticle Graphic (Right Side) -->
  <g class="reticle-spin" opacity="0.45">
    <circle cx="1020" cy="180" r="90" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="12 8" />
    <circle cx="1020" cy="180" r="115" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="6 14" />
  </g>
  <g opacity="0.6">
    <!-- Viewfinder Corners -->
    <path d="M 950 120 L 930 120 L 930 140" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <path d="M 1090 120 L 1110 120 L 1110 140" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <path d="M 950 240 L 930 240 L 930 220" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <path d="M 1090 240 L 1110 240 L 1110 220" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <!-- AI Scanning Line across viewfinder -->
    <line class="scanner" x1="930" y1="100" x2="1110" y2="100" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" />
    <!-- Center Point & Coordinates -->
    <circle cx="1020" cy="180" r="3.5" fill="#ec4899" />
    <text x="1020" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AI SCENE RECOGNITION // 60 FPS</text>
  </g>

  <!-- Title & Subtitle in crisp Foreground -->
  <g id="foreground-content" transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="268" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="1">CURATED CURATION &amp; REPO</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome AI Mobile
    </text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Camera &amp; Filter App
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Top AI Camera Apps, Computational Photography Frameworks &amp; On-Device Neural Pipelines
    </text>

    <!-- Feature Interactive / Dynamic Floating Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: On-Device AI -->
      <g class="float-1" transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#shadow)" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🤖 On-Device AI &amp; NPU</text>
      </g>

      <!-- Pill 2: Real-time Filters -->
      <g class="float-2" transform="translate(196, 0)">
        <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#shadow)" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⚡ Real-Time Shaders</text>
      </g>

      <!-- Pill 3: 3D LUTs -->
      <g class="float-3" transform="translate(402, 0)">
        <rect width="168" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#shadow)" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🎨 3D LUT Color &amp; RAW</text>
      </g>

      <!-- Pill 4: Open-Source -->
      <g class="float-4" transform="translate(586, 0)">
        <rect width="198" height="42" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#shadow)" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🔓 Open-Source Pipelines</text>
      </g>
    </g>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(0, 335)">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
        <tspan fill="#38bdf8" font-weight="700">★ 20k+ Stars</tspan> Frameworks  •  <tspan fill="#ec4899" font-weight="700">iOS &amp; Android</tspan> Ecosystem  •  <tspan fill="#a855f7" font-weight="700">SaaS &amp; Self-Hosted</tspan> Architecture
      </text>
    </g>
  </g>
</svg>
